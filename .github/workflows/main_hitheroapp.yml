# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - hitheroApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Test database for the test suite (BE1-3). Deploy needs build, so a
    # failing test means no deploy.
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version and cache dependencies
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.12'
          cache: 'pip' # Enable pip caching

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upload artifact source
        # Zip before test tools and caches are added to the checkout.
        run: zip release.zip ./* -r

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            curl -sSL -o /tmp/msprod.deb https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/msprod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - name: Lint
        run: ruff check .

      - name: Seed test database
        run: python -m tests.seed

      - name: Run tests
        env:
          TEST_DATABASE: "1"
        run: pytest

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/ # Exclude the venv from the artifact if you're not deploying it directly

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4 # Updated to v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2 # Current latest stable version
        id: deploy-to-webapp
        with:
          app-name: 'hitheroApp'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D27C0786100747BD90CEF73E09EF048B }}