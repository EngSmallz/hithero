<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Homeroom Heroes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon.ico" />
    <link rel="stylesheet" href="/static/style.css"> 
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17482080573"></script>
    <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'AW-17482080573'); </script> 
    

</head>
<body class="bg-gray-800 text-gray-50">
    <header class="bg-gradient-to-r from-green-700 to-green-900 text-white shadow-lg py-4 md:py-6 relative">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center">
                <a href="/pages/homepage.html" class="flex items-center">
                    <img src="/static/images/logo_transparent.png" alt="Homeroom Heroes Logo" class="h-16 md:h-20 mr-3">
                </a>
                <nav class="hidden md:flex ml-4">
                    <ul class="flex space-x-4 md:space-x-8 text-lg">
                        <li><a href="/pages/homepage.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">Home</a></li>
                        <li><a href="/pages/index.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">Donate</a></li>
                        <li><a href="/pages/register.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">Sign Up</a></li>
                        <li><a href="/pages/about.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">About</a></li>
                        <li><a href="/pages/contact.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">Contact</a></li>
                        <li><a href="/pages/partners.html" class="hover:text-green-200 transition duration-300 ease-in-out rounded-md p-2">Partners</a></li>
                    </ul>
                </nav>
            </div>

            <div class="relative">
                <button id="hamburgerButton" class="text-white text-3xl focus:outline-none **md:hidden**" onclick="toggleMenu()">☰</button>

                <div class="menu-items absolute right-0 top-full mt-2 w-48 bg-green-800 rounded-md shadow-lg py-1 z-20 hidden **md:hidden**" id="menuItems">
                    
                    <nav class="md:hidden">
                        <ul class="flex flex-col text-base p-1">
                            <li><a href="/pages/homepage.html" class="listButton block">Home</a></li>
                            <li><a href="/pages/index.html" class="listButton block">Donate</a></li>
                            <li><a href="/pages/register.html" class="listButton block">Sign Up</a></li>
                            <li><a href="/pages/about.html" class="listButton block">About</a></li>
                            <li><a href="/pages/contact.html" class="listButton block">Contact</a></li>
                            <li><a href="/pages/partners.html" class="listButton block">Partners</a></li>
                            <hr class="my-1 border-green-700"> </ul>
                    </nav>
                    
                    <button id="loginButton" class="listButton hidden" onclick="redirectTo('/pages/login.html')">Login</button>
                    <button id="logoutButton" class="listButton hidden" onclick="logout()">Logout</button>
                    <button id="mypageButton" class="listButton hidden" onclick="mypage()">My Page</button>
                    <button id="forumButton" class="listButton hidden" onclick="redirectTo('/pages/forum.html')">Forum</button>
                    <button id="validationButton" class="listButton hidden" onclick="redirectTo('/pages/validation.html')">Validation</button>
                </div>
            </div>
        </div>
    </header>
      
    <main class="flex-grow container mx-auto px-4 py-8 flex items-center justify-center">
        <section class="auth-card-md">
            <h2 class="text-3xl font-bold text-green-700 mb-6 text-center">Update Your Password</h2>
            <form id="update-form" method="post" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label for="old_password" class="auth-label">Old Password:</label>
                    <input type="password" id="old_password" name="old_password" required class="auth-input-lg">
                </div>
                <div>
                    <label for="new_password" class="auth-label">New Password:</label>
                    <input type="password" id="new_password" name="new_password" required class="auth-input-lg">
                </div>
                <div>
                    <label for="new_password_confirmed" class="auth-label">Confirm New Password:</label>
                    <input type="password" id="new_password_confirmed" name="new_password_confirmed" required class="auth-input-lg">
                </div>
                <div class="pt-4">
                    <button id="submitButton" type="submit" class="auth-submit-lg">
                        Submit
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-auto rounded-t-lg shadow-inner text-center">
        <div class="container mx-auto px-4 text-sm">
            <p>&copy; 2024 Homeroom Heroes. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/forms.js"></script>
    <script>
        // This function dynamically shows/hides menu items based on user authentication and role.
        document.addEventListener("DOMContentLoaded", function () {
            const updateForm = document.getElementById("update-form");
            const submitButton = document.getElementById("submitButton");

            submitButton.addEventListener("click", async function (event) {
                event.preventDefault(); // Prevent default form submission

                try {
                    const response = await forms.postForm("/profile/update_password/", updateForm);

                    if (response.ok) {
                        alert('Password updated successfully!');
                        window.location.href = '/pages/teacher.html'; // Redirect to teacher profile page
                    } else {
                        // Attempt to parse JSON error message if available
                        const errorData = (await forms.parseJsonSafe(response)) || {};
                        alert(`Failed to update password: ${errorData.detail || response.statusText}. Please try again.`);
                        // Optionally reload if you want to clear the form
                        window.location.reload(); 
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                    window.location.reload();
                }
            });
            // Ensure header buttons are set up on load
            checkAuthentication();
        });

    </script>
</body>
</html>
